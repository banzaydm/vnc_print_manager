<!DOCTYPE html>
<html>
  <head>
    <base href="/rustdesk_web/" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Remote Desktop." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RustDesk" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>RustDesk</title>
    <link rel="manifest" href="manifest.json" />

    <script id="custom-config" type="text/plain"></script>

    <script type="module" crossorigin src="js/dist/index.js"></script>
    <link rel="modulepreload" href="js/dist/vendor.js" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #root {
        background-repeat: no-repeat;
        background-size: 100% auto;
      }
      .page-loading-warp {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px;
      }
      #div-background {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 420px;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="div-background">
        <img src="./favicon.svg" alt="logo" width="256" />
        <div class="page-loading-warp">
          <div class="ant-spin ant-spin-lg ant-spin-spinning">
            <span class="ant-spin-dot ant-spin-dot-spin">
              <i class="ant-spin-dot-item"></i>
              <i class="ant-spin-dot-item"></i>
              <i class="ant-spin-dot-item"></i><i class="ant-spin-dot-item"></i>
            </span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center">
          <img src="./favicon.svg" width="32" style="margin-right: 8px" />
          <span id="span-text">RustDesk Web Client V2</span>
        </div>
      </div>
    </div>

    <script>
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
      const myTheme = localStorage.getItem("wc-option:local:theme");
      const them = myTheme || systemTheme;

      const divBackground = document.querySelector("#div-background");
      if (divBackground) {
        divBackground.style.backgroundColor = them === "dark" ? "#000" : "#fff";
      }
      const spanConsole = document.querySelector("#span-text");
      if (spanConsole) {
        spanConsole.style.color = them === "dark" ? "#fff" : "#000";
      }

      function loadMainDartJs() {
        var scriptTag = document.createElement("script");
        scriptTag.src = "main.dart.js";
        scriptTag.type = "application/javascript";
        document.body.append(scriptTag);
      }
      loadMainDartJs();

      window.onGlobalEvent = function (str) {
        try {
          var evt = JSON.parse(str);
          if (evt && evt.name === "msgbox" && evt.text) {
            var box = document.getElementById("rd-msg");
            box.querySelector(".rd-msg-text").textContent =
              (evt.title ? evt.title + ": " : "") + evt.text;
            box.style.display = "flex";
          }
        } catch (e) {}
      };
    </script>
    <div id="rd-msg" style="display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 99999; background: #1f2937; color: #f9fafb; border: 1px solid #ef4444; border-radius: 10px; padding: 12px 16px; max-width: 80%; box-shadow: 0 8px 24px rgba(0,0,0,.4); font: 14px/1.4 system-ui, sans-serif; align-items: center; gap: 10px;">
      <span class="rd-msg-text"></span>
      <button onclick="this.parentNode.style.display='none'" style="background:#ef4444; color:#fff; border:none; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px;">OK</button>
    </div>
    <script src="libs/stream/ponyfill.min.js"></script>
    <script src="libs/stream/StreamSaver.min.js"></script>
  </body>
</html>
