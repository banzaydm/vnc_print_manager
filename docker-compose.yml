version: '3.8'

services:
  vnc-print-manager:
    build: .
    image: vnc-print-manager:local
    ports:
      - "5000:5000"  # Веб-интерфейс
    volumes:
      - vnc_manager_data:/app/instance  # Сохранение базы данных и логов
      - vnc_manager_db:/app/vnc_manager.db  # База данных SQLite
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - NOVNC_PROXY_PORT=6080
      - NOVNC_TOKEN_TTL_SECONDS=600
      - INIT_DB_ON_START=1
    restart: unless-stopped
    networks:
      - vnc_net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',5000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  websockify:
    build: .
    image: vnc-print-manager:local
    depends_on:
      - vnc-print-manager
    ports:
      - "6080:6080"  # noVNC WebSocket прокси
    volumes:
      - vnc_manager_data:/app/instance  # Общий TokenFile и логи websockify
      - vnc_manager_db:/app/vnc_manager.db  # Общий доступ к базе данных
    environment:
      - NOVNC_PROXY_PORT=6080
    command: ["python", "-m", "websockify", "--token-plugin", "TokenFile", "--token-source", "/app/instance/novnc_tokens.txt", "--verbose", "6080"]
    restart: unless-stopped
    networks:
      - vnc_net

  # Опционально: можно добавить базу данных PostgreSQL для продакшена
  # postgres:
  #   image: postgres:15
  #   container_name: vnc-print-db
  #   environment:
  #     POSTGRES_DB: vnc_manager
  #     POSTGRES_USER: vnc_user
  #     POSTGRES_PASSWORD: vnc_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  vnc_manager_data:
    driver: local
  vnc_manager_db:
    driver: local

networks:
  vnc_net:
    driver: bridge
